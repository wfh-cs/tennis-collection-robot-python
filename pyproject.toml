[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-collection-robot"
version = "2.0.0"
description = "Modern Python vision and route planning stack for a tennis collection robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PySide6>=6.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tennis-robot = "tennis_robot.cli:main"
tennis-robot-ui = "tennis_robot.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

